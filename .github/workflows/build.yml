name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Syntaxprüfung
        run: python3 -m py_compile src/plasma_osd_position/*.py

      - name: Version prüfen
        id: version
        run: |
          VERSION="$(grep -oP '(?<=__version__ = ")[^"]+' src/plasma_osd_position/__init__.py)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          grep -q "^Version: *$VERSION$" packaging/plasma-osd-position.spec \
            || { echo "::error::Version in der .spec passt nicht zu $VERSION"; exit 1; }
          grep -q "<release version=\"$VERSION\"" data/org.kde.plasma-osd-position.metainfo.xml \
            || { echo "::error::Kein <release> für $VERSION in der metainfo.xml"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} passt nicht zu __version__ = $VERSION"; exit 1
          fi

      - name: Desktop- und AppStream-Dateien validieren
        run: |
          sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream
          desktop-file-validate data/org.kde.plasma-osd-position.desktop
          appstreamcli validate --no-net --explain data/org.kde.plasma-osd-position.metainfo.xml

  deb:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p dist && ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  rpm:
    needs: check
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y rpm-build tar findutils grep
      - uses: actions/checkout@v4
      - run: mkdir -p dist && ./packaging/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  arch:
    needs: check
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel
      - uses: actions/checkout@v4
      - name: Paket bauen (makepkg läuft nicht als root)
        run: |
          useradd -m builder
          mkdir -p dist && chown builder dist
          su builder -c "./packaging/build-arch.sh '$PWD/dist'"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  flatpak:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: flatpak-builder installieren
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Flatpak bauen
        run: |
          APP_ID=io.github.derkellerpotato.PlasmaOsdPosition
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo=flatpak-repo flatpak-build packaging/flatpak/$APP_ID.yml
          mkdir -p dist
          flatpak build-bundle flatpak-repo \
            "dist/plasma-osd-position-${{ needs.check.outputs.version }}-x86_64.flatpak" "$APP_ID" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*.flatpak

  appimage:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Laufzeitbibliotheken für den Qt-Selbsttest
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 file
      - run: ./packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  # Installiert jedes native Paket auf der Ziel-Distribution, damit die
  # Abhängigkeitsnamen tatsächlich aufgelöst werden, und importiert die GUI.
  install-test:
    needs: [deb, rpm, arch]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:stable", artifact: deb, install: "apt-get update && apt-get install -y ./pkg/*.deb" }
          - { image: "ubuntu:24.04", artifact: deb, install: "apt-get update && apt-get install -y ./pkg/*.deb" }
          - { image: "fedora:latest", artifact: rpm, install: "dnf install -y ./pkg/*.rpm" }
          - { image: "opensuse/tumbleweed", artifact: rpm, install: "zypper --non-interactive install --allow-unsigned-rpm ./pkg/*.rpm" }
          - { image: "archlinux:latest", artifact: arch, install: "pacman -Syu --noconfirm && pacman -U --noconfirm ./pkg/*.pkg.tar.zst" }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: pkg
      - name: Paket installieren
        run: ${{ matrix.install }}
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: GUI importieren
        run: |
          test -x /usr/bin/plasma-osd-position
          QT_QPA_PLATFORM=offscreen python3 -c "import sys; sys.path.insert(0, '/usr/share/plasma-osd-position'); import plasma_osd_position.gui"
          python3 -c "import PyQt6.QtDBus" && echo "QtDBus vorhanden" || echo "QtDBus fehlt - Fallback auf qdbus"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, install-test, flatpak, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
